<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧱 Tetris</title>
<style>
  :root {
    --bg: #0d1020;
    --panel: #161b33;
    --line: rgba(255,255,255,0.08);
    --text: #e8e6ff;
    --muted: #9298c4;
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a1f3a, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    margin-bottom: 4px;
    background: linear-gradient(90deg, #6c8cff, #b06cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }

  .game {
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }
  .stage {
    position: relative;
    background: #080a16;
    border: 2px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    touch-action: none;
  }
  canvas { display: block; border-radius: 8px; }

  .side { display: flex; flex-direction: column; gap: 14px; width: 132px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .card .lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .card .val { font-size: 1.45rem; font-weight: 700; }
  .next-wrap { display: flex; flex-direction: column; align-items: center; }
  #next { background: #080a16; border-radius: 8px; margin-top: 4px; }

  .btn {
    background: linear-gradient(135deg, #6c8cff, #b06cff);
    border: none; color: white; font-weight: 700;
    padding: 11px; border-radius: 11px; cursor: pointer;
    font-size: 0.95rem; transition: transform 0.12s, filter 0.15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: var(--panel); border: 1px solid var(--line); }

  .keys { font-size: 0.72rem; color: var(--muted); line-height: 1.7; }
  .keys b { color: var(--text); font-weight: 600; }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(8,10,22,0.82);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 8px; text-align: center; gap: 10px;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 1.6rem; }
  .overlay p { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>🧱 TETRIS</h1>
  <div class="subtitle">← → 이동 · ↑ 회전 · ↓ 소프트드롭 · Space 하드드롭 · P 일시정지</div>

  <div class="game">
    <div class="stage">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">테트리스</h2>
        <p id="ovText">시작 버튼을 누르거나 Enter를 치세요</p>
        <button class="btn" id="startBtn" style="margin-top:6px;padding:11px 26px">▶ 시작</button>
      </div>
    </div>

    <div class="side">
      <div class="card next-wrap">
        <div class="lbl">다음 블록</div>
        <canvas id="next" width="104" height="104"></canvas>
      </div>
      <div class="card"><div class="lbl">점수</div><div class="val" id="score">0</div></div>
      <div class="card"><div class="lbl">레벨</div><div class="val" id="level">1</div></div>
      <div class="card"><div class="lbl">라인</div><div class="val" id="lines">0</div></div>
      <div class="card"><div class="lbl">최고 점수</div><div class="val" id="best" style="color:#4ade80">0</div></div>
      <button class="btn ghost" id="pauseBtn">⏸ 일시정지</button>
      <div class="keys">
        <b>←→</b> 이동 &nbsp; <b>↑</b> 회전<br>
        <b>↓</b> 소프트드롭<br>
        <b>Space</b> 하드드롭<br>
        <b>P</b> 일시정지
      </div>
    </div>
  </div>

<script>
const COLS = 10, ROWS = 20, CELL = 30;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');

const COLORS = {
  I: '#37e6e6', J: '#5b6bff', L: '#ff9f43',
  O: '#ffe14d', S: '#4ade80', T: '#c06cff', Z: '#ff5b7a'
};
const SHAPES = {
  I: [[0,1],[1,1],[2,1],[3,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]],
  O: [[1,0],[2,0],[1,1],[2,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  T: [[1,0],[0,1],[1,1],[2,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]]
};
const TYPES = Object.keys(SHAPES);

let grid, current, next, pos, score, level, lines, gameOver, paused, running;
let dropInterval, dropTimer, lastTime;
let best = parseInt(localStorage.getItem('tetris_best') || '0', 10);
document.getElementById('best').textContent = best;

function newGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function spawnPiece(type) {
  const cells = SHAPES[type].map(([x, y]) => ({ x, y }));
  return { type, cells, color: COLORS[type] };
}

function randomType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }

function reset() {
  grid = newGrid();
  score = 0; level = 1; lines = 0;
  gameOver = false; paused = false;
  current = spawnPiece(randomType());
  next = spawnPiece(randomType());
  pos = { x: 3, y: 0 };
  dropInterval = 800;
  updateStats();
}

// absolute occupied cells for a piece at a position
function occupied(piece, p) {
  return piece.cells.map(c => ({ x: c.x + p.x, y: c.y + p.y }));
}

function collides(piece, p) {
  return occupied(piece, p).some(c =>
    c.x < 0 || c.x >= COLS || c.y >= ROWS || (c.y >= 0 && grid[c.y][c.x])
  );
}

function rotate(piece) {
  // rotate cells 90deg clockwise around centroid-ish pivot
  const rotated = piece.cells.map(c => ({ x: -c.y, y: c.x }));
  // normalize to non-negative
  const minX = Math.min(...rotated.map(c => c.x));
  const minY = Math.min(...rotated.map(c => c.y));
  return { ...piece, cells: rotated.map(c => ({ x: c.x - minX, y: c.y - minY })) };
}

function lockPiece() {
  occupied(current, pos).forEach(c => {
    if (c.y >= 0) grid[c.y][c.x] = current.color;
  });
  clearLines();
  current = next;
  next = spawnPiece(randomType());
  pos = { x: 3, y: 0 };
  if (collides(current, pos)) endGame();
  drawNext();
}

function clearLines() {
  let cleared = 0;
  for (let y = ROWS - 1; y >= 0; y--) {
    if (grid[y].every(cell => cell)) {
      grid.splice(y, 1);
      grid.unshift(Array(COLS).fill(null));
      cleared++;
      y++;
    }
  }
  if (cleared) {
    const points = [0, 100, 300, 500, 800][cleared] * level;
    score += points;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 800 - (level - 1) * 70);
    updateStats();
  }
}

function move(dx, dy) {
  const np = { x: pos.x + dx, y: pos.y + dy };
  if (!collides(current, np)) { pos = np; return true; }
  return false;
}

function softDrop() {
  if (!move(0, 1)) { lockPiece(); }
  else { score += 1; updateStats(); }
}

function hardDrop() {
  let dist = 0;
  while (move(0, 1)) dist++;
  score += dist * 2;
  updateStats();
  lockPiece();
}

function tryRotate() {
  const r = rotate(current);
  // wall kicks: try offsets
  for (const dx of [0, -1, 1, -2, 2]) {
    if (!collides(r, { x: pos.x + dx, y: pos.y })) {
      current = r; pos = { x: pos.x + dx, y: pos.y };
      return;
    }
  }
}

function endGame() {
  gameOver = true; running = false;
  cancelAnimationFrame(dropTimer);
  if (score > best) {
    best = score;
    localStorage.setItem('tetris_best', String(best));
    document.getElementById('best').textContent = best;
  }
  showOverlay('게임 오버', `점수 ${score} · ${lines}라인 · Lv.${level}`, '↻ 다시 시작');
}

function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
}

// ---------- rendering ----------
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawCell(c, x, y, color, cell = CELL) {
  const px = x * cell, py = y * cell;
  roundRect(c, px + 1, py + 1, cell - 2, cell - 2, 5);
  c.fillStyle = color;
  c.fill();
  // glossy highlight
  c.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(c, px + 3, py + 3, cell - 6, (cell - 6) * 0.4, 3);
  c.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
  }
  // settled blocks
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (grid[y][x]) drawCell(ctx, x, y, grid[y][x]);

  if (!gameOver && current) {
    // ghost piece
    let ghostY = pos.y;
    while (!collides(current, { x: pos.x, y: ghostY + 1 })) ghostY++;
    occupied(current, { x: pos.x, y: ghostY }).forEach(c => {
      if (c.y >= 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        roundRect(ctx, c.x * CELL + 1, c.y * CELL + 1, CELL - 2, CELL - 2, 5);
        ctx.fill();
      }
    });
    // active piece
    occupied(current, pos).forEach(c => { if (c.y >= 0) drawCell(ctx, c.x, c.y, current.color); });
  }
}

function drawNext() {
  nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  const cell = 24;
  const xs = next.cells.map(c => c.x), ys = next.cells.map(c => c.y);
  const w = Math.max(...xs) - Math.min(...xs) + 1;
  const h = Math.max(...ys) - Math.min(...ys) + 1;
  const ox = (nextCanvas.width - w * cell) / 2 - Math.min(...xs) * cell;
  const oy = (nextCanvas.height - h * cell) / 2 - Math.min(...ys) * cell;
  next.cells.forEach(c => {
    drawCell(nctx, (c.x * cell + ox) / cell, (c.y * cell + oy) / cell, next.color, cell);
  });
}

// ---------- loop ----------
function loop(time = 0) {
  if (!running) return;
  if (!paused) {
    const delta = time - lastTime;
    if (delta > dropInterval) {
      if (!move(0, 1)) lockPiece();
      lastTime = time;
    }
    draw();
  }
  dropTimer = requestAnimationFrame(loop);
}

// ---------- controls ----------
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !running) { startGame(); return; }
  if (!running || gameOver) return;
  if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
  if (paused) return;
  switch (e.key) {
    case 'ArrowLeft': move(-1, 0); draw(); e.preventDefault(); break;
    case 'ArrowRight': move(1, 0); draw(); e.preventDefault(); break;
    case 'ArrowDown': softDrop(); draw(); e.preventDefault(); break;
    case 'ArrowUp': tryRotate(); draw(); e.preventDefault(); break;
    case ' ': hardDrop(); draw(); e.preventDefault(); break;
  }
});

function showOverlay(title, text, btn) {
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').textContent = text;
  document.getElementById('startBtn').textContent = btn;
  document.getElementById('overlay').classList.remove('hidden');
}
function hideOverlay() { document.getElementById('overlay').classList.add('hidden'); }

function startGame() {
  reset();
  hideOverlay();
  drawNext();
  running = true; lastTime = 0;
  requestAnimationFrame(loop);
}

function togglePause() {
  if (!running || gameOver) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ 계속하기' : '⏸ 일시정지';
  if (paused) showOverlay('일시정지', 'P 또는 계속하기를 누르세요', '▶ 계속하기');
  else { hideOverlay(); }
}

document.getElementById('startBtn').addEventListener('click', () => {
  if (paused) togglePause();
  else startGame();
});
document.getElementById('pauseBtn').addEventListener('click', togglePause);

draw();
</script>
</body>
</html>
